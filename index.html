<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>呑み迷子 - NOMI-MAIGO</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Sawarabi+Mincho&display=swap"
        rel="stylesheet"
    >

    <!-- Adobe Fonts -->
    <script>
        (function(d) {

            var config = {
                kitId: 'gpu6rtb',
                scriptTimeout: 3000,
                async: true
            },

            h = d.documentElement,

            t = setTimeout(function() {

                h.className =
                    h.className.replace(/\bwf-loading\b/g, "")
                    + " wf-inactive";

            }, config.scriptTimeout),

            tk = d.createElement("script"),
            f = false,
            s = d.getElementsByTagName("script")[0],
            a;

            h.className += " wf-loading";

            tk.src =
                'https://use.typekit.net/'
                + config.kitId
                + '.js';

            tk.async = true;

            tk.onload =
            tk.onreadystatechange =
            function() {

                a = this.readyState;

                if (
                    f ||
                    a &&
                    a != "complete" &&
                    a != "loaded"
                ) return;

                f = true;

                clearTimeout(t);

                try {
                    Typekit.load(config);
                } catch(e) {}

            };

            s.parentNode.insertBefore(tk, s);

        })(document);
    </script>


    <style>

        /* ==========================================
           全体
        ========================================== */

        body {

            margin: 0;

            font-family:
                "sicyubi-mohitsugyosho",
                sans-serif;

            font-weight: 400;
            font-style: normal;

            background-image: url('BG.png');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;

            display: flex;
            flex-direction: column;
            align-items: center;

            min-height: 100vh;
        }


        .container,
        .maigo-fuda {

            background-color:
                rgba(255, 255, 255, 0.6)
                !important;

            border-radius: 15px;

            font-family:
                "sicyubi-futofuder",
                sans-serif
                !important;
        }


        .container,
        .maigo-fuda {

            width: 92%;
            max-width: 400px;

            margin: 20px auto;

            padding: 20px;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.05);

            box-sizing: border-box;
        }


        header {

            width: 100%;

            padding: 30px 0 10px;

            display: flex;

            justify-content: center;
            align-items: center;
        }


        h2,
        h3 {

            text-align: center;

            margin-top: -5px !important;
            margin-bottom: -5px !important;
        }



        /* ==========================================
           タイトル画像
        ========================================== */

        .section-title-img {

            text-align: center;

            margin-top: 5px;
            margin-bottom: 5px;
        }


        .section-title-img img {

            max-width: 140px;

            height: auto;

            display: inline-block;
        }



        /* ==========================================
           迷子札
        ========================================== */

        .order-hint {

            font-family:
                "ab-ootori",
                sans-serif
                !important;

            font-style: normal;

            font-weight: 400;

            font-size: 34px;

            margin: 10px 0;

            text-align: center;
        }


        /*
         一杯目の迷子札

         white-space: nowrap
         → スマホでも途中改行しない

         clamp
         → 画面が狭い時だけ文字を少し小さくする
        */

        #drink-hint {

            font-family:
                "ab-ootori",
                sans-serif
                !important;

            font-size:
                clamp(22px, 7.5vw, 34px);

            white-space: nowrap;

            width: 100%;

            overflow: visible;

            text-align: center;

            letter-spacing: -0.02em;
        }


        /*
         お店を選択した後の
         「一杯目に○○を頼め」
        */

        #mission-drink-hint {

            font-family:
                "ab-ootori",
                sans-serif
                !important;

            font-size:
                clamp(16px, 5vw, 20px)
                !important;

            white-space: nowrap;

            overflow: visible;

            text-overflow: clip;

            width: 100%;

            box-sizing: border-box;

            letter-spacing: -0.03em;

            margin: 10px 0;
        }


        /*
         通常の追加ミッション
        */

        .mission-unit .order-hint {

            font-family:
                "ab-ootori",
                sans-serif
                !important;

            font-size:
                clamp(17px, 5vw, 20px);

            line-height: 1.4;

            overflow-wrap: normal;

            word-break: keep-all;
        }


        .mission-unit {

            margin-bottom: 12px;

            padding-top: 5px;
            padding-bottom: 8px;

            font-size: 20px;

            text-align: center;
        }


        .mission-btns {

            display: flex;

            justify-content: space-around;

            gap: 12px;

            margin-top: 8px !important;
            margin-bottom: 2px !important;
        }



        /* ==========================================
           達成・失敗
        ========================================== */

        .m-img-btn {

            height: 40px;

            width: auto;

            cursor: pointer;

            transition:
                transform 0.1s,
                opacity 0.1s;
        }


        .m-img-btn:active {

            transform: scale(0.95);
        }


        .m-img-btn.selected {

            transform: scale(1.2);

            opacity: 1;
        }


        .m-img-btn.dimmed {

            transform: scale(1);

            opacity: 0.3;
        }



        /* ==========================================
           下部ボタン
        ========================================== */

        .f-img-btn {

            width: auto;

            height: 45px;

            cursor: pointer;
        }


        .footer-btns {

            display: flex;

            flex-direction: column-reverse;

            align-items: center;

            gap: 10px;

            margin-top: 15px;

            width: 100%;
        }



        /* ==========================================
           店舗カード
        ========================================== */

        .shop-card {

            display: flex;

            align-items: center;

            background: #fff;

            border:
                2.5px solid
                rgba(26, 35, 126, 0.5)
                !important;

            height: 100px;
        }


        .shop-card,
        .shop-card * {

            font-family:
                sans-serif
                !important;

            font-weight: normal;
        }


        .shop-card p,
        .shop-card div:not(.shop-name) {

            font-size:
                0.75rem
                !important;

            line-height: 1.3;

            margin: 3px 0;
        }



        /* ==========================================
           フェード
        ========================================== */

        .fade-out {

            animation:
                fadeOut
                0.5s
                ease-out
                forwards;
        }


        .fade-in {

            animation:
                fadeIn
                0.5s
                ease-in
                forwards;
        }


        @keyframes fadeOut {

            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }


        @keyframes fadeIn {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }


        #mission-screen {

            opacity: 0;

            transition: opacity 0.5s;
        }


        #result-screen {

            opacity: 0;
        }



        /* ==========================================
           リザルト
        ========================================== */

        .result-text {

            color: #444;

            font-family:
                sans-serif
                !important;

            font-weight:
                normal
                !important;
        }


        /*
         ★破線を完全削除
        */

        #result-screen {

            border: none !important;

            margin-top: 0 !important;

            padding-top: 5px !important;
        }


        .result-btns {

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 12px;

            margin-top: 15px;
        }


        .res-img-btn {

            height: 45px;

            width: auto;

            cursor: pointer;

            transition:
                transform 0.1s;
        }


        .res-img-btn:active {

            transform: scale(0.95);
        }



        /* ==========================================
           リザルト：指令履歴
        ========================================== */

        #result-missions-container {

            margin: 20px auto;

            max-width: 320px;

            text-align: left;

            padding:
                0 15px;

            display: flex;

            flex-direction: column;

            gap: 10px;
        }


        .result-mission-item {

            display: flex;

            align-items: center;

            font-family:
                "ab-ootori",
                sans-serif;

            font-size: 16px;

            font-weight: 400;

            color: #000;

            min-height: 36px;

            margin-bottom: 2px;
        }


        .result-mission-item:last-child {

            margin-bottom:
                0 !important;
        }


        .result-stamp {

            height: 36px;

            width: auto;

            margin-right: 12px;

            flex-shrink: 0;
        }


        .result-mission-item.failed {

            opacity: 0.25;

            padding-left: 48px;
        }


        .small-text {

            font-size:
                0.9998rem
                !important;
        }



        /* ==========================================
           スマホ調整
        ========================================== */

        @media screen and (max-width: 480px) {

            .container,
            .maigo-fuda {

                width: 92%;

                padding-left: 14px;
                padding-right: 14px;
            }


            #drink-hint {

                font-size:
                    clamp(
                        20px,
                        7vw,
                        30px
                    );

                white-space: nowrap;

                letter-spacing:
                    -0.04em;
            }


            #mission-drink-hint {

                font-size:
                    clamp(
                        15px,
                        4.7vw,
                        19px
                    )
                    !important;

                white-space: nowrap;

                letter-spacing:
                    -0.05em;
            }


            .mission-unit .order-hint {

                font-size:
                    clamp(
                        16px,
                        4.8vw,
                        19px
                    );
            }


            .result-mission-item {

                font-size: 15px;
            }
        }


        /*
         かなり幅の狭いスマホ
        */

        @media screen and (max-width: 360px) {

            #drink-hint {

                font-size:
                    clamp(
                        18px,
                        6.5vw,
                        25px
                    );
            }


            #mission-drink-hint {

                font-size:
                    15px
                    !important;

                letter-spacing:
                    -0.07em;
            }
        }


        /* ==========================================
           起動スプラッシュ
        ========================================== */

        #splash-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;

            background-image: url('BG.png');
            background-size: cover;
            background-position: center;

            opacity: 1;
            transition: opacity 0.5s ease;
        }

        #splash-screen img {
            width: 300px;
            max-width: 78vw;
            height: auto;
            animation: splashLogoIn 0.45s ease-out;
        }

        #splash-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        @keyframes splashLogoIn {
            from {
                opacity: 0;
                transform: scale(0.85);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        #main-content {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #main-content.show {
            opacity: 1;
        }



        /* ==========================================
           リザルト文字フォント
        ========================================== */

        #result-summary,
        .result-message,
        .result-mission-item,
        .result-mission-text {
            font-family:
                "ab-ootori",
                sans-serif
                !important;

            font-style: normal;
            font-weight: 400;
        }

        /* 最初の画面「どこで呑む？」 */
        #shop-hint {
            font-family:
                "ab-ootori",
                sans-serif
                !important;

            font-style: normal;
            font-weight: 400;
            font-size: 30px;
            margin: 10px 0 5px;
            white-space: nowrap;
        }

    </style>

<body>

<!-- 起動時ロゴ -->

<!-- 通常画面 -->

     ミッション画面
========================================== -->

<div
    id="mission-screen"
    class="container"
    style="display:none;"
>


    <!-- 選んだお店 -->

    <div
        id="mission-shop-title"

    <!-- 最初の迷子札 -->

<!-- ==========================================
     トップ
========================================== -->

<header>

    <div class="logo-area">

        <img
            src="logo.png"

            style="
                width:150px;

            "

</header>



<!-- 店舗候補 -->

<div id="shop-container" class="container">

<!-- 最初の迷子札 -->

<div class="maigo-fuda">

    <div class="section-title-img">

        <img
            src="plate.png"

</div>



<!-- 探す -->

<div
    id="button-container"
    style="text-align:center;"
>

    <img
        id="action-button"
        src="search.png"
        onclick="startGacha()"
        style="
            cursor:pointer;
            width:300px;
            max-width:80%;
        "
        alt="お店を探す"
    >

<script>

/* ==========================================
   起動スプラッシュ
========================================== */

window.addEventListener("load", () => {

    const splash = document.getElementById("splash-screen");
    const main = document.getElementById("main-content");

    // ロゴは最低1秒表示。
    // Adobe Fonts等のフォント読み込みが1秒以上かかった場合は、
    // 読み込み完了までスプラッシュを残す。
    const minimumDisplay = new Promise(resolve => {
        setTimeout(resolve, 1000);
    });

    const fontsReady = document.fonts
        ? document.fonts.ready
        : Promise.resolve();

    Promise.all([minimumDisplay, fontsReady]).then(() => {

        splash.classList.add("fade-out");
        main.classList.add("show");

        setTimeout(() => {
            splash.style.display = "none";
        }, 500);

    });

});


/* ==========================================
   共通フェード
========================================== */

function fadeTransition(
    hideSelectors,
    showElement,
    callback = null
) {

    hideSelectors.forEach(sel => {

        document
            .querySelectorAll(sel)
            .forEach(el => {

                el.classList.add(
                    "fade-out"
                );

            });

    });


    setTimeout(() => {

        hideSelectors.forEach(sel => {

            document
                .querySelectorAll(sel)
                .forEach(el => {

                    el.style.display =
                        "none";

                });

        });


        if (callback) {

            callback();

        }


        showElement.style.display =
            "block";


        showElement.classList.remove(
            "fade-out"
        );


        showElement.classList.add(
            "fade-in"
        );


    }, 500);

}



/* ==========================================
   使用済みミッション
========================================== */

let usedMissions = [];



/* ==========================================
   店舗表示
========================================== */

function displayShops(
    data,
    currentRange
) {

    const shopList =
        document.getElementById(
            'shop-list'
        );


    const hint =
        document.getElementById(
            'drink-hint'
        );


    const drinks = [

        "生ビール",
        "生ビール",
        "生ビール",
        "生ビール",
        "生ビール",
        "生ビール",

        "ハイボール",
        "ハイボール",
        "ハイボール",

        "レモンサワー",
        "レモンサワー",
        "レモンサワー",

        "日本酒",

        "焼酎",

        "ウーロンハイ",

        "カシオレ",

        "トマトハイ"

    ];



    /* 一杯目 */

    if (hint) {

        const randomDrink =

            drinks[
                Math.floor(
                    Math.random()
                    * drinks.length
                )
            ];


        hint.innerText =
            "一杯目は"
            + randomDrink;

    }



    if (!shopList) return;


    shopList.innerHTML = "";



    if (
        !data ||
        !data.results ||
        !data.results.shop ||
        data.results.shop.length === 0
    ) {

        shopList.innerHTML =

            '<p style="text-align:center;">'
            + '近くにお店が見つかりませんでした。'
            + '</p>';


        return;
    }



    /* 検索距離 */

    const rangeText =
        document.createElement('p');


    rangeText.style.cssText =

        "font-size:0.8rem;"
        + "color:#666;"
        + "text-align:center;"
        + "font-family:serif;";


    rangeText.innerText =
        `(${currentRange}以内の結果)`;


    shopList.appendChild(
        rangeText
    );



    /* 3店舗 */

    const shops =

        [...data.results.shop]

        .sort(
            () =>
                0.5
                - Math.random()
        )

        .slice(0, 3);



    shops.forEach(shop => {


        const shopCard =
            document.createElement(
                'div'
            );


        shopCard.className =
            'shop-card';


        shopCard.style.cssText =

            "display:flex;"
            + "align-items:center;"
            + "background:#fff;"
            + "border:1px solid #1a237e;"
            + "margin-bottom:10px;"
            + "padding:10px;"
            + "cursor:pointer;"
            + "border-radius:10px;"
            + "box-sizing:border-box;";



        shopCard.innerHTML = `

            <img

                src="${shop.photo.pc.l}"

                style="
                    width:80px;
                    height:80px;
                    object-fit:cover;
                    margin-right:15px;
                    border-radius:10px;
                    flex-shrink:0;
                "

                alt="${shop.name}"
            >


            <div
                style="
                    flex:1;
                    min-width:0;
                "
            >

                <div
                    class="shop-desc"
                    style="
                        font-weight:bold;
                        margin-bottom:5px;
                    "
                >
                    ${shop.name}
                </div>


                <div class="shop-desc">

                    ${shop.genre.name}

                    <br>

                    ${shop.access}

                </div>

            </div>

        `;



        shopCard.onclick = () => {


            const missionScreen =

                document.getElementById(
                    "mission-screen"
                );



            fadeTransition(

                [

                    "header",

                    "#shop-container",

                    ".maigo-fuda",

                    "#button-container"

                ],

                missionScreen,

                () => {


                    const selectedPlace =

                        document.getElementById(
                            "selected-shop-card"
                        );


                    selectedPlace.innerHTML =
                        "";


                    selectedPlace.appendChild(
                        shopCard.cloneNode(true)
                    );



                    const firstDrink =

                        document.getElementById(
                            "drink-hint"
                        )
                        .innerText;



                    document
                        .getElementById(
                            "mission-drink-hint"
                        )
                        .innerText =

                            firstDrink
                            .replace(
                                "一杯目は",
                                "一杯目に"
                            )

                            + "を頼め";

                }

            );

        };


        shopList.appendChild(
            shopCard
        );

    });

}



/* ==========================================
   次の迷子札
========================================== */

function getNextMission() {


    const container =

        document.getElementById(
            'dynamic-mission-container'
        );


    if (!container) return;



    const tasks = [

        "店主のおすすめを聞け",

        "隣の人と乾杯せよ",

        "本日のおすすめを注文せよ",

        "一番人気のつまみを頼め",

        "店員さんの名前を覚えろ",

        "揚げ物を1品頼め",

        "自分以外が頼んだ酒を頼め",

        "おすすめの日本酒を聞け",

        "メニューの中で<br>一番長い名前の商品を注文せよ",

        "呑み迷子の画面を<br>誰かに見せて説明せよ",

        "スマホを15分間触らず<br>味に集中せよ",

        "メニューの1番右上の品を頼め",

        "一番辛いメニューを頼め",

        "〆の一品を注文せよ",

        "デザートを注文せよ",

        "いつもは頼まない<br>ジャンルのお酒を頼め",

        "ハイボールを濃いめで頼め",

        "ソフトドリンクを1杯挟め",

        "おすすめの日本酒に合うつまみを<br>店員に聞け",

        "隣の席の人が食べている料理を頼め",

        "店名の由来を聞け",

        "今日一番の「うまい！」を声に出せ",

        "箸を使わずに食べられる<br>つまみを頼め",

        "おしぼりを綺麗に折りたたんで置け",

        "店内の一番こだわっていそうな<br>装飾を撮れ",

        "看板の写真を撮れ",

        "スベっている格言が貼ってあるか<br>チェックせよ",

        "箸袋で箸置きを作れ",

        "今日一番映えてるおつまみを撮れ",

        "利き手と反対の手だけで<br>次のつまみを食べきれ",

        "箸立てや調味料入れの<br>こだわりを観察せよ"

    ];



    let availableTasks =

        tasks.filter(

            task =>
                !usedMissions.includes(
                    task
                )

        );



    if (
        availableTasks.length === 0
    ) {

        usedMissions = [];

        availableTasks =
            [...tasks];

    }



    const randomTask =

        availableTasks[

            Math.floor(

                Math.random()

                * availableTasks.length

            )

        ];



    usedMissions.push(
        randomTask
    );


    if (
        usedMissions.length > 10
    ) {

        usedMissions.shift();

    }



    const newMission =

        document.createElement(
            'div'
        );


    newMission.className =
        'mission-unit';


    newMission.style.cssText =

        "margin-top:10px;"
        + "border-top:1px dashed #ccc;"
        + "padding-top:10px;";



    const plainTask =

        randomTask.replace(
            /<br\s*\/?>/gi,
            ""
        );


    const textSizeClass =

        plainTask.length >= 13

        ? 'small-text'

        : '';



    newMission.innerHTML = `

        <h3
            class="
                order-hint
                ${textSizeClass}
            "
        >

            ${randomTask}

        </h3>


        <div class="mission-btns">


            <img
                src="fail.png"
                class="m-img-btn"
                onclick="selectResult(this, false)"
                alt="失敗"
            >


            <img
                src="achievement.png"
                class="m-img-btn"
                onclick="selectResult(this, true)"
                alt="達成"
            >


        </div>

    `;


    container.appendChild(
        newMission
    );


    window.scrollTo({

        top:
            document.body.scrollHeight,

        behavior:
            'smooth'

    });

}



/* ==========================================
   店舗データ取得
========================================== */

async function fetchAndDisplay(
    lat,
    lng,
    rangeIndex = 1
) {


    const shopList =

        document.getElementById(
            'shop-list'
        );


    const rangeLabels = {

        1: "300m",

        2: "500m",

        3: "1000m"

    };


    if (shopList) {

        shopList.innerHTML =

            `<p style="text-align:center;">`

            + `${rangeLabels[rangeIndex]}圏内を探索中...`

            + `</p>`;

    }



    try {


        const response =

            await fetch(

                `/getShops?lat=${lat}&lng=${lng}&range=${rangeIndex}`

            );


        if (!response.ok) {

            throw new Error(
                "店舗取得エラー"
            );

        }


        const data =

            await response.json();



        const shopCount =

            data
            ?.results
            ?.shop
            ?.length
            || 0;



        if (
            shopCount < 3
            &&
            rangeIndex < 3
        ) {

            return fetchAndDisplay(

                lat,

                lng,

                rangeIndex + 1

            );

        }



        displayShops(

            data,

            rangeLabels[
                rangeIndex
            ]

        );


    } catch(e) {


        console.error(e);


        if (shopList) {

            shopList.innerHTML =

                '<p style="text-align:center;">'
                + '通信エラーが発生しました。'
                + '</p>';

        }

    }

}



/* ==========================================
   探索開始
========================================== */

function startGacha() {


    if (
        !navigator.geolocation
    ) {

        alert(
            "この端末では位置情報を利用できません"
        );

        return;
    }



    navigator
        .geolocation
        .getCurrentPosition(


            pos => {

                fetchAndDisplay(

                    pos.coords.latitude,

                    pos.coords.longitude

                );

            },


            () => {

                alert(
                    "位置情報を許可してください"
                );

            },


            {

                enableHighAccuracy: true,

                timeout: 10000,

                maximumAge: 60000

            }

        );

}



/* ==========================================
   達成・失敗選択
========================================== */

function selectResult(
    button,
    isSuccess
) {


    const parent =

        button.closest(
            '.mission-btns'
        );


    if (!parent) return;



    const buttons =

        parent.querySelectorAll(
            '.m-img-btn'
        );



    buttons.forEach(btn => {

        btn.classList.remove(
            'selected',
            'dimmed'
        );

    });



    button.classList.add(
        'selected'
    );



    buttons.forEach(btn => {

        if (
            btn !== button
        ) {

            btn.classList.add(
                'dimmed'
            );

        }

    });

}



/* ==========================================
   リザルト表示
========================================== */

function showResult() {


    const totalMissions =

        document.querySelectorAll(
            '.mission-unit'
        ).length;



    const successCount =

        document.querySelectorAll(
            '.m-img-btn.selected[alt="達成"]'
        ).length;



    const missionsContainer =

        document.getElementById(
            'result-missions-container'
        );


    missionsContainer.innerHTML =
        '';



    document
        .querySelectorAll(
            '.mission-unit'
        )
        .forEach(unit => {


            const textElement =

                unit.querySelector(
                    '.order-hint'
                )

                ||

                unit.querySelector(
                    'h3'
                )

                ||

                unit.querySelector(
                    'p'
                );


            if (!textElement) return;



            const missionText =

                textElement
                .innerText
                .trim();



            const isSuccess =

                unit.querySelector(
                    '.m-img-btn.selected[alt="達成"]'
                )

                !== null;



            const item =

                document.createElement(
                    'div'
                );


            item.classList.add(
                'result-mission-item'
            );



            if (isSuccess) {


                item.innerHTML = `

                    <img
                        src="stamp.png"
                        class="result-stamp"
                        alt="達成"
                    >

                    <span
                        class="result-mission-text"
                    >
                        ${missionText}
                    </span>

                `;


            } else {


                item.classList.add(
                    'failed'
                );


                item.innerHTML = `

                    <span
                        class="result-mission-text"
                    >
                        ${missionText}
                    </span>

                `;

            }



            missionsContainer
                .appendChild(
                    item
                );

        });



    /*
     ★リザルトにお店名を表示しない
    */

    document
        .getElementById(
            'result-summary'
        )
        .innerHTML = `

            <p
                style="
                    font-size:1.5rem;
                    color:#1a237e;
                    font-weight:bold;
                    margin-bottom:0;
                "
            >

                ミッション達成率：
                ${successCount}
                /
                ${totalMissions}

            </p>

        `;



    document
        .querySelector(
            '.result-message'
        )
        ?.remove();



    missionsContainer
        .insertAdjacentHTML(

            'afterend',

            `

                <div class="result-message">

                    ${
                        successCount
                        ===
                        totalMissions

                        ?

                        `
                        <p
                            style="
                                margin-top:0;
                                text-align:center;
                                line-height:1.6;
                            "
                        >
                            パーフェクト！
                            <br>
                            完璧な呑みっぷり！
                        </p>
                        `

                        :

                        `
                        <p
                            style="
                                margin-top:35px;
                                font-size:1.35rem;
                                text-align:center;
                                line-height:1.6;
                            "
                        >
                            お疲れ様！
                            <br>
                            もう一軒行こ！
                        </p>
                        `
                    }

                </div>

            `

        );



    /*
     ★お店関連だけを消す

     result.pngは消さない
    */

    fadeTransition(

        [

            '#first-mission-unit',

            '#dynamic-mission-container',

            '.footer-btns',

            '#selected-shop-card',

            '#mission-shop-title',

            '#mission-plate-title'

        ],

        document.getElementById(
            'result-screen'
        )

    );

}
